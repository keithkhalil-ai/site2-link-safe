<body>
<div class="container">
  <h1>Is This Link Safe?</h1>
  <div class="input-group">
    <input type="text" id="urlInput" placeholder="https://example.com" autocomplete="off">
    <button id="checkBtn">Check</button>
  </div>
  <div class="adslot" style="margin:16px 0;min-height:90px;border:1px dashed #2a3140;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#5b6577;font-size:12px">Advertisement</div>
  <div id="result" class="result"></div>
</div>

<script>
(function() {
  const brands = ['paypal', 'google', 'amazon', 'apple', 'netflix', 'chase'];
  const input = document.getElementById('urlInput');
  const btn = document.getElementById('checkBtn');
  const resultDiv = document.getElementById('result');

  function check() {
    const raw = input.value.trim();
    resultDiv.style.display = 'block';
    resultDiv.className = 'result';
    resultDiv.innerHTML = '';

    if (!raw) {
      resultDiv.innerHTML = '<p class="error">Please enter a URL.</p>';
      return;
    }

    let url;
    try {
      const withProto = /^https?:\/\//i.test(raw) ? raw : 'http://' + raw;
      url = new URL(withProto);
    } catch (e) {
      resultDiv.innerHTML = '<p class="error">Invalid URL format.</p>';
      return;
    }

    const hostname = url.hostname.toLowerCase();
    const protocol = url.protocol;
    const hasUserInfo = url.username !== '' || url.password !== '';

    const reasons = [];
    let highRisk = false;
    let mediumRisk = false;
    let lowRisk = false;

    // Punycode / IDN
    if (hostname.includes('xn--')) {
      reasons.push('Punycode/IDN hostname detected (xn--)');
      highRisk = true;
    }

    // Lookalike brands
    const tokens = hostname.split(/[.-]/);
    const brandMatch = brands.find(b => tokens.includes(b));
    if (brandMatch) {
      const isOfficial = hostname === brandMatch + '.com' || hostname.endsWith('.' + brandMatch + '.com');
      if (!isOfficial) {
        reasons.push('Lookalike brand detected: "' + brandMatch + '"');
        highRisk = true;
      }
    }

    // Hyphen in brand
    if (hostname.includes('-') && brands.some(b => hostname.includes(b))) {
      reasons.push('Hyphen in brand name');
      highRisk = true;
    }

    // IP-literal host
    const ipv4 = /^(\d{1,3}\.){3}\d{1,3}$/;
    if (ipv4.test(hostname) || hostname.includes(':')) {
      reasons.push('IP-literal host detected');
      highRisk = true;
    }

    // @ in authority
    if (hasUserInfo) {
      reasons.push('@ in authority (userinfo) detected');
      highRisk = true;
    }

    // >3 subdomains
    const parts = hostname.split('.');
    if (parts.length > 4) {
      reasons.push('More than 3 subdomains detected');
      mediumRisk = true;
    }

    // Long random hostname
    if (hostname.length > 30 || parts.some(p => p.length > 15)) {
      reasons.push('Long or random-looking hostname');
      mediumRisk = true;
    }

    // Non-https
    if (protocol !== 'https:') {
      reasons.push('Non-HTTPS protocol');
      lowRisk = true;
    }

    let verdict = 'LOW';
    let cls = 'verdict-low';
    if (highRisk) {
      verdict = 'HIGH';
      cls = 'verdict-high';
    } else if (mediumRisk) {
      verdict = 'MEDIUM';
      cls = 'verdict-medium';
    } else if (lowRisk) {
      verdict = 'LOW';
      cls = 'verdict-low';
    }

    let html = '<div class="' + cls + '" style="padding-left:12px;">';
    html += '<h3>Verdict: ' + verdict + '</h3>';
    if (reasons.length === 0) {
      html += '<p>No suspicious signals detected.</p>';
    } else {
      html += '<ul>';
      reasons.forEach(r => {
        html += '<li>' + r + '</li>';
      });
      html += '</ul>';
    }
    html += '</div>';
    resultDiv.innerHTML = html;
  }

  btn.addEventListener('click', check);
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') check();
  });
})();
</script>
